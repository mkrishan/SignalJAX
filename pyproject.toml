[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "SignalJAX"
version = "0.2.0"
description = "JAX calculus for KL projection message passing and cross-paradigm signal studies."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "Manish Krishan Lal" },
]
keywords = [
  "automatic-differentiation",
  "belief-propagation",
  "jax",
  "kullback-leibler",
  "message-passing",
  "projection-methods",
  "signal-propagation",
  "sum-product-networks",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "jax>=0.4.30",
]

[project.optional-dependencies]
test = [
  "hypothesis>=6",
  "pytest>=8",
  "pytest-cov>=5",
]
dev = [
  "build>=1.2",
  "hatchling>=1.25",
  "hypothesis>=6",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.8",
  "twine>=6",
]

[project.urls]
Paper = "https://doi.org/10.48550/arXiv.2512.24335"

[tool.hatch.build.targets.wheel]
packages = ["src/kl_projection_message_passing"]

[tool.hatch.build.targets.wheel.force-include]
"CITATION.cff" = "kl_projection_message_passing/CITATION.cff"

[tool.hatch.build.targets.sdist]
exclude = [
  "/outputs",
  "/work",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
filterwarnings = ["error"]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["outputs", "work"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "UP"]
